<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ecosistema Digital{% endblock %}</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans border-t-4 border-blue-600">

    <!-- Navegación Principal -->
    <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo / Nombre -->
                <div class="flex items-center space-x-3">
                    <span class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-indigo-500 tracking-wider">
                        PLATAFORMA
                    </span>
                </div>

                <!-- Menú de enlaces -->
                <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
                    <a href="/" class="hover:text-blue-400 transition flex items-center gap-2"><i class="fa-solid fa-music text-blue-500"></i> Hub Musical</a>
                    <a href="/trading" class="hover:text-blue-400 transition flex items-center gap-2"><i class="fa-solid fa-chart-line text-emerald-500"></i> Trading Journal</a>
                    <a href="/tools" class="hover:text-blue-400 transition flex items-center gap-2"><i class="fa-solid fa-wand-magic-sparkles text-purple-500"></i> Tools & Automation</a>
                    <a href="/login" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-semibold text-white transition"><i class="fa-solid fa-user"></i> Acceder</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Dinámico -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 py-6 text-center text-xs text-gray-500">
        <p>&copy; 2026 Ecosistema Digital | Todos los derechos reservados.</p>
    </footer>

</body>
</html>
