{% extends 'base.html' %}
{% block title %}Acceso al Sistema | Ecosistema Digital{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-12 bg-gray-900 border border-gray-800 p-8 rounded-3xl shadow-2xl space-y-6">
    <div class="text-center space-y-2">
        <div class="w-12 h-12 bg-blue-950 border border-blue-800 text-blue-400 rounded-2xl mx-auto flex items-center justify-center text-lg">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Panel de Control</h1>
        <p class="text-gray-400 text-xs">Introduce tus credenciales de acceso administrativo.</p>
    </div>

    <form action="/login" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Usuario</label>
            <input type="text" name="username" required placeholder="Tu username" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Contraseña</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 font-semibold text-white py-3 rounded-xl text-sm transition shadow-lg shadow-blue-600/20">Iniciar Sesión</button>
    </form>
</div>
{% endblock %}
